[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arthasim"
version = "0.0.1"
description = "Indian financial ecosystem simulator (phase 0 spike)"
requires-python = ">=3.11"
dependencies = ["numpy", "numba", "polars", "pyarrow", "duckdb", "pydantic>=2", "pyyaml", "optuna>=5.1"]

[project.optional-dependencies]
dev = ["pytest", "hypothesis"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running gate test"]
addopts = "-m 'not slow'"
pythonpath = ["tests"]
